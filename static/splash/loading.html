<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Office Tool</title>
<style>
  /* This page IS the entire loading window — a small, frameless, exactly-
     square native window (see app.py's __main__ block: webview.create_
     window(..., frameless=True, width=228, height=228)), not a small
     thing floating inside a big window. Per explicit feedback on the
     first version of this (a full 1400x900 window with the square just
     floating in a sea of empty black title-bar+background around it):
     only the square itself should ever be visible during loading — no
     title bar, no surrounding window chrome, no empty backdrop.

     Python owns the actual "is the server ready yet" polling and the
     swap to the real window now (a background thread with plain
     urllib, then window.show() on the real window + this window's own
     destroy()) — simpler than doing it from here, and it sidesteps
     entirely the file://-URI-plus-query-string class of bug that caused
     a real ERR_FILE_NOT_FOUND on an earlier version of this page. This
     page's own JS has nothing left to do but set the right theme
     (officeToolSetTheme, called once via evaluate_js right after this
     loads) and sit there looking alive until Python swaps it out. */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#14161a}
  body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
  body[data-brand-theme="light"]{background:#f5f4f0}
  .sq{position:relative;width:100%;height:100%;overflow:hidden;
      background-image:url('launch-dark.png');background-size:cover;background-position:center;
      animation:pulse 1.8s ease-in-out infinite}
  body[data-brand-theme="light"] .sq{background-image:url('launch-light.png')}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.97);opacity:.88}}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:6px;justify-content:center}
  .dots span{width:6px;height:6px;border-radius:50%;background:#f0a63e;animation:blink 1.2s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
  <div class="sq"><div class="dots"><span></span><span></span><span></span></div></div>
  <script>
    window.officeToolSetTheme = function(theme){
      document.body.setAttribute('data-brand-theme', theme === 'light' ? 'light' : 'dark');
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Office Tool</title>
<style>
  /* This page IS the entire loading window — a small, frameless, exactly-
     square native window (see app.py's __main__ block: webview.create_
     window(..., frameless=True, width=228, height=228)), not a small
     thing floating inside a big window. Per explicit feedback on the
     first version of this (a full 1400x900 window with the square just
     floating in a sea of empty black title-bar+background around it):
     only the square itself should ever be visible during loading — no
     title bar, no surrounding window chrome, no empty backdrop.

     Python owns the actual "is everything ready yet" checking and the
     swap to the real window now (background threads with plain urllib,
     then window.show() on the real window + this window's own
     destroy()) — simpler than doing it from here, and it sidesteps
     entirely the file://-URI-plus-query-string class of bug that caused
     a real ERR_FILE_NOT_FOUND on an earlier version of this page. This
     page's own JS has nothing left to do but set the right theme
     (officeToolSetTheme) and, on the rare occasion the separate ~400MB
     Chromium runtime needs downloading (see runtime_manager.py — first
     install, or the rare case Playwright's own Chromium build moved on;
     an ordinary app update never touches it), show real progress via
     officeToolSetProgress so a first run or a runtime bump never just
     sits there in silence for however long that download takes. */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#14161a}
  body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
  body[data-brand-theme="light"]{background:#f5f4f0}
  .sq{position:relative;width:100%;height:100%;overflow:hidden;
      background-image:url('launch-dark.png');background-size:cover;background-position:center;
      animation:pulse 1.8s ease-in-out infinite}
  body[data-brand-theme="light"] .sq{background-image:url('launch-light.png')}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.97);opacity:.88}}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:6px;justify-content:center;transition:opacity .2s}
  .dots span{width:6px;height:6px;border-radius:50%;background:#f0a63e;animation:blink 1.2s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .progress{position:absolute;left:16px;right:16px;bottom:16px;display:none}
  .progress.show{display:block}
  .progress.show + .dots{opacity:0}
  .progress-label{color:#fff;font-size:10px;text-align:center;margin-bottom:5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .progress-track{height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
  .progress-fill{height:100%;width:0%;border-radius:2px;background:#f0a63e;transition:width .2s ease}
</style>
</head>
<body>
  <div class="sq">
    <div class="progress" id="progress">
      <div class="progress-label" id="progress-label">Downloading required files…</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.officeToolSetTheme = function(theme){
      document.body.setAttribute('data-brand-theme', theme === 'light' ? 'light' : 'dark');
    };
    // pct<0 hides the bar again (used once the download finishes and the
    // window is about to swap over anyway — no need to show "100%" and
    // then immediately vanish).
    window.officeToolSetProgress = function(pct){
      var el = document.getElementById('progress');
      if (pct == null || pct < 0) { el.classList.remove('show'); return; }
      el.classList.add('show');
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-label').textContent = 'Downloading required files… ' + pct + '%';
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Office Tool</title>
<style>
  /* Small, self-contained loading page — shown FIRST, before the real app
     window opens. It's a plain local file (no Flask dependency), so it
     paints instantly and fills the gap between the native window
     appearing and Flask/WebView2 actually being ready to show the real
     page. The square is the SAME banner used for the splash/login
     background — background-size:cover on a small square box crops it
     to a square automatically, no separate asset needed. This page's own
     script polls the real app URL and navigates this window there the
     moment it answers. */
  html,body{margin:0;padding:0;width:100%;height:100%;background:#14161a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
  body[data-brand-theme="light"]{background:#f5f4f0}
  .sq{position:relative;width:200px;height:200px;border-radius:22px;overflow:hidden;
      box-shadow:0 14px 44px rgba(0,0,0,.45);
      background-image:url('launch-dark.png');background-size:cover;background-position:center;
      animation:pulse 1.8s ease-in-out infinite}
  body[data-brand-theme="light"] .sq{background-image:url('launch-light.png');box-shadow:0 14px 44px rgba(0,0,0,.16)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.97);opacity:.88}}
  .dots{position:absolute;left:0;right:0;bottom:16px;display:flex;gap:6px;justify-content:center}
  .dots span{width:6px;height:6px;border-radius:50%;background:#f0a63e;animation:blink 1.2s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
  <div class="sq"><div class="dots"><span></span><span></span><span></span></div></div>
  <script>
    var params = new URLSearchParams(location.search);
    var theme = params.get('theme') === 'light' ? 'light' : 'dark';
    var target = params.get('target') || '';
    document.body.setAttribute('data-brand-theme', theme);
    (function poll(){
      if (!target) return;
      fetch(target, {cache:'no-store'}).then(function(r){
        // Any real HTTP response (even a 4xx/5xx) means Flask is up and
        // answering — navigate over. Only a network-level failure (server
        // not listening yet) should keep waiting.
        location.href = target;
      }).catch(function(){ setTimeout(poll, 150); });
    })();
  </script>
</body>
</html>

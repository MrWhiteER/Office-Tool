<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="{{ doc_page_js }}"></script>
<style>
  @font-face{font-family:'Onest';src:url({{ onest_src }}) format('woff2');font-weight:100 900;font-display:swap}
  doc-page:not(:defined){visibility:hidden}
  body{margin:0;background:#525659;font-family:'Onest',sans-serif;color:#231f20}
</style>
</head>
<body>

<doc-page size="a4" margin="12mm">

  <div slot="header" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:8px;border-bottom:2.5px solid #ec6b2f;margin-bottom:2px;">
    <img src="{{ logo_src }}" alt="Sololuce" style="height:46px;width:auto;display:block;border-radius:4%;">
    <div style="font-family:'Onest',sans-serif;font-weight:800;font-size:27px;letter-spacing:.3px;color:#231f20;text-transform:uppercase;">Index</div>
  </div>

  <div slot="footer" style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #d6dbe1;padding-top:6px;margin-top:2px;font-size:9px;font-weight:700;color:#231f20;">
    <span>&copy;All Rights Reserved</span>
    <span>{{ website }}</span>
  </div>

  <div style="margin-top:26px;">
    {% for s in sections %}
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #d6d6d6;">
      <span style="font-family:'Onest',sans-serif;font-weight:700;font-size:17px;letter-spacing:.3px;text-transform:uppercase;">{{ s.label }}</span>
      <span style="flex:1;border-bottom:1px dotted #c7c7c7;margin:0 4px;transform:translateY(-5px);"></span>
      <span class="num" style="font-family:'Onest',sans-serif;font-weight:700;font-size:17px;">{{ s.start_page }}</span>
    </div>
    {% endfor %}
  </div>

</doc-page>
</body>
</html>
